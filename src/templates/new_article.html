{% extends "layout.html" %}

{% block title %}Lisää lähde{% endblock %}

{% block body %}
<h1>Lisää artikkeli</h1>

{% if saved %}
  <p role="status">Artikkeli tallennettu.</p>
{% endif %}

{% if error %}
  <p role="alert">{{ error }}</p>
{% endif %}

<input class="reference-form-choice" type="radio" id="article-form" name="reference-form-choice" checked>
<label for="article-form">Artikkeli</label>

<input class="reference-form-choice" type="radio" id="article-book" name="reference-form-choice">
<label for="article-book">Kirja</label>

<input class="reference-form-choice" type="radio" id="article-conference" name="reference-form-choice">
<label for="article-conference">Konferenssi julkaisu</label>

<div class="reference-forms">
  <form class="reference-form-panel article-form" action="/articles" method="post">
    <p>
      <label for="citation_key">Viiteavain</label><br>
      <input id="citation_key" name="citation_key" required
            value="{{ values.get('citation_key', '') }}">
    </p>

    <p>
      <label for="author">Kirjoittaja</label><br>
      <input id="author" name="author" required
            value="{{ values.get('author', '') }}">
    </p>

    <p>
      <label for="title">Otsikko</label><br>
      <input id="title" name="title" required
            value="{{ values.get('title', '') }}">
    </p>

    <p>
      <label for="journal">Julkaisun nimi</label><br>
      <input id="journal" name="journal" required
            value="{{ values.get('journal', '') }}">
    </p>

    <p>
      <label for="year">Vuosi</label><br>
      <input id="year" name="year" inputmode="numeric" required
            value="{{ values.get('year', '') }}">
    </p>

    <button type="submit">Tallenna artikkeli</button>
  </form>
  <form class="reference-form-panel article-book" action="/books" method="post">
    <p>
      <label for="citation_key">Viiteavain</label><br>
      <input id="citation_key" name="citation_key" required
            value="{{ values.get('citation_key', '') }}">
    </p>

    <p>
      <label for="author">Kirjoittaja</label><br>
      <input id="author" name="author" required
            value="{{ values.get('author', '') }}">
    </p>

    <p>
      <label for="title">Otsikko</label><br>
      <input id="title" name="title" required
            value="{{ values.get('title', '') }}">
    </p>

    <p>
      <label for="journal">Julkaisun nimi</label><br>
      <input id="journal" name="journal" required
            value="{{ values.get('journal', '') }}">
    </p>

    <p>
      <label for="year">Vuosi</label><br>
      <input id="year" name="year" inputmode="numeric" required
            value="{{ values.get('year', '') }}">
    </p>

    <button type="submit">Tallenna kirja</button>
  </form>
  <form class="reference-form-panel article-conference" action="/conference" method="post">
    <p>
      <label for="citation_key">Viiteavain</label><br>
      <input id="citation_key" name="citation_key" required
            value="{{ values.get('citation_key', '') }}">
    </p>

    <p>
      <label for="author">Kirjoittaja</label><br>
      <input id="author" name="author" required
            value="{{ values.get('author', '') }}">
    </p>

    <p>
      <label for="title">Otsikko</label><br>
      <input id="title" name="title" required
            value="{{ values.get('title', '') }}">
    </p>

    <p>
      <label for="journal">Julkaisun nimi</label><br>
      <input id="journal" name="journal" required
            value="{{ values.get('journal', '') }}">
    </p>

    <p>
      <label for="year">Vuosi</label><br>
      <input id="year" name="year" inputmode="numeric" required
            value="{{ values.get('year', '') }}">
    </p>

    <button type="submit">Tallenna konferenssi julkaisu</button>
  </form>
</div>
<p><a href="/">Takaisin etusivulle</a></p>
{% endblock %}
