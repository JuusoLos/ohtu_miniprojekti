name: CI

env:
  DATABASE_URL: sqlite:///test.db
  TEST_ENV: true
  SECRET_KEY: sekret

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Install Pylint
        run: uv pip install pylint

      - name: Run Pylint
        run: uv run --no-sync pylint src
      - name: Run unit tests
        run: uv run pytest src/tests

      - name: Install Playwright browser
        run: uv run rfbrowser install --with-deps chromium
      - name: Run robot tests
        run: bash run_robot_tests.sh